[workspace]
members = [
    "crates/webapp-common",
    "crates/webapp-server",
    "crates/webapp-client",
    "example/server",
    "example/client",
]
# The client crates only compile to wasm32; build them with trunk (or
# `cargo check -p <crate> --target wasm32-unknown-unknown`).
default-members = [
    "crates/webapp-common",
    "crates/webapp-server",
    "example/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
webapp-common = { path = "crates/webapp-common" }
webapp-server = { path = "crates/webapp-server" }
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
getrandom = "0.4"
leptos = { version = "0.8", features = ["csr"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
