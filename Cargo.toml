[workspace]
members = [
    "crates/webapp-common",
    "crates/webapp-server",
    "crates/webapp-client",
    "example/server",
    "example/client",
]
# The client crates only compile to wasm32; build them with trunk (or
# `cargo check -p <crate> --target wasm32-unknown-unknown`).
default-members = [
    "crates/webapp-common",
    "crates/webapp-server",
    "example/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
leptos = { version = "0.8", features = ["csr"] }
