[package]
name = "webapp-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
webapp-common.workspace = true
js-sys.workspace = true
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Headers",
    "History",
    "Location",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "UrlSearchParams",
    "Window",
] }

[features]
# Authenticated WebSocket helper (`connect_ws`); pairs with webapp-server's
# `ws` feature.
ws = [
    "webapp-common/ws",
    "web-sys/CloseEvent",
    "web-sys/Event",
    "web-sys/MessageEvent",
    "web-sys/WebSocket",
]
# Discord activity mode in `<AuthGate>`: the bundled Embedded App SDK, Discord
# sign-in and the in-memory bearer token. Pairs with webapp-server's
# `discord-activity` feature.
discord-activity = ["webapp-common/discord-activity"]
